<!doctype html>
<html lang="en" data-bs-theme="dark">
    <!-- The data-bs-theme attribute is added to ensure Bootstrap components default to the correct theme -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}LLMChat Web{% endblock %}</title>
        <link
            rel="icon"
            type="image/x-icon"
            href="{{ url_for('static', filename='favicon.ico') }}"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link
            id="main-theme-stylesheet"
            rel="stylesheet"
            href="{{ url_for('static', filename='css/custom.css') }}"
        />
        <link id="theme-override-stylesheet" rel="stylesheet" href="" />
        {% block head_extra %}
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/paraiso-dark.css"
        />
        {% endblock %}
    </head>
    <body class="d-flex flex-column h-100">
        <div id="app-container" class="d-flex flex-column flex-grow-1">
            {% block body %}{% endblock %}
        </div>

        <!-- All scripts are now at the end of the body -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        {% block scripts_extra %}
        <!-- External libraries are loaded dynamically by main_controller.js -->
        {% endblock %}

        <!-- Application Scripts -->
        <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
        <script src="{{ url_for('static', filename='js/session_api.js') }}"></script>

        <!-- START: Refactored Main Controller Scripts -->
        <script src="{{ url_for('static', filename='js/theme_manager.js') }}"></script>
        <script src="{{ url_for('static', filename='js/session_ui.js') }}"></script>
        <!-- END: Refactored Main Controller Scripts -->

        <script src="{{ url_for('static', filename='js/rag_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/llm_settings_ui.js') }}"></script>

        <!-- START: Refactored Prompt Manager Scripts -->
        <script src="{{ url_for('static', filename='js/prompt_shortcuts_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/prompt_editor_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/prompt_list_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/prompt_manager_ui.js') }}"></script>
        <!-- END: Refactored Prompt Manager Scripts -->

        <script src="{{ url_for('static', filename='js/prompt_template_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/ingestion_ui.js') }}"></script>

        <!-- START: Refactored Agent Scripts -->
        <script src="{{ url_for('static', filename='js/agent_api.js') }}"></script>
        <script src="{{ url_for('static', filename='js/agent_stream.js') }}"></script>
        <script src="{{ url_for('static', filename='js/agent_tasks.js') }}"></script>
        <script src="{{ url_for('static', filename='js/agent_ui.js') }}"></script>
        <!-- END: Refactored Agent Scripts -->

        <script src="{{ url_for('static', filename='js/chat_ui.js') }}"></script>

        <!-- START: Refactored Context Manager Scripts -->
        <script src="{{ url_for('static', filename='js/context_preview_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/context_workbench_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/context_workspace_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/context_history_ui.js') }}"></script>
        <script src="{{ url_for('static', filename='js/context_manager_ui.js') }}"></script>
        <!-- END: Refactored Context Manager Scripts -->

        <!-- Main controller/initializer, loaded last. -->
        <script src="{{ url_for('static', filename='js/main_controller.js') }}"></script>
    </body>
</html>
