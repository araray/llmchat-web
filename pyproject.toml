[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmchat-web"
version = "0.17.0" # Version for llmchat-web
description = "A Flask-based web interface for LLMCore, providing chat and RAG functionalities."
readme = "README.md" # Assuming llmchat-web will have its own README
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Araray Velho", email = "araray@gmail.com" }
]
keywords = ["llm", "ai", "chat", "web", "flask", "ui", "llmcore", "rag", "openai", "anthropic", "ollama", "gemini"] # Updated keywords
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application", # Added for Flask
    "Framework :: Flask", # Added for Flask
    "Operating System :: OS Independent",
]

# Core dependencies for llmchat-web
dependencies = [
    "Flask>=3.0.0",
    "pydantic>=2.0.0",
    "werkzeug>=3.0.0",
    "httpx[http2]>=0.28.1",
    "appdirs>=1.4.4",
]

# Optional dependencies for server functionality
[project.optional-dependencies]
server = [
    "python-daemon>=3.1.2",     # For daemonizing the web server
    "gunicorn>=23.0.0",         # For a production-ready WSGI server
]

[project.urls]
Homepage = "https://github.com/araray/llmchat-web"
Repository = "https://github.com/araray/llmchat-web"
Documentation = "https://github.com/araray/llmchat-web"
Issues = "https://github.com/araray/llmchat-web/issues"

[project.scripts]
llmchat-web = "llmchat_web.app:main_cli"

# --- Setuptools specific configuration ---
[tool.setuptools.packages.find]
where = ["."]
include = ["llmchat_web*"]

# --- Ruff Linter & Formatter Configuration ---
[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "B", "A", "RUF", "ASYNC", "PT"
]
ignore = [
    "E501", "B008", "C901"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- MyPy Type Checker Configuration ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "llmchat_web.*"
disallow_untyped_defs = true

# --- Pytest Configuration ---
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=llmchat_web --cov-report=term-missing --cov-report=xml" # Corrected coverage target
testpaths = [
    "tests",
]
asyncio_mode = "auto"

# --- Coverage Configuration (Example for llmchat-web) ---
[tool.coverage.run]
source = ["llmchat_web"] # Corrected coverage source
omit = [
    "llmchat_web/app.py", # Main entry point with __main__ block
]

[tool.coverage.report]
show_missing = true
fail_under = 70 # Adjusted target for web app potentially
